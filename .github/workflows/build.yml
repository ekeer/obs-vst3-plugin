name: Build obs-vst3-plugin

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'obs-vst3/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo
  OBS_VERSION: 32.1.2

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          path: obs-vst3-plugin

      - name: Clone OBS Studio
        shell: pwsh
        run: |
          git clone --recursive --depth 1 `
            -b ${{ env.OBS_VERSION }} `
            https://github.com/obsproject/obs-studio.git obs-studio

      - name: Copy plugin into OBS tree
        shell: pwsh
        run: |
          Copy-Item -Recurse `
            "${{ github.workspace }}/obs-vst3-plugin/obs-vst3" `
            "${{ github.workspace }}/obs-studio/plugins/obs-vst3"
          # Remove our root CMakeLists.txt so OBS's own is used
          Remove-Item "${{ github.workspace }}/obs-studio/plugins/obs-vst3/CMakeLists.txt"
          # Copy the cmake config
          Copy-Item "${{ github.workspace }}/obs-vst3-plugin/obs-vst3/CMakeLists.txt" `
            "${{ github.workspace }}/obs-studio/plugins/obs-vst3/CMakeLists.txt"

      - name: Install obs-deps via cmake preset
        shell: pwsh
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake --preset windows-x64 -DENABLE_VST3=ON -DENABLE_VST=OFF

      - name: Build
        shell: pwsh
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake --build build_x64 --config ${{ env.BUILD_TYPE }} --target obs-vst3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vst3-plugin-windows-x64
          path: |
            ${{ github.workspace }}/obs-studio/build_x64/plugins/obs-vst3/${{ env.BUILD_TYPE }}/obs-vst3.dll
            ${{ github.workspace }}/obs-studio/build_x64/plugins/obs-vst3/${{ env.BUILD_TYPE }}/obs-vst3.pdb
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: obs-vst3-plugin

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev \
            libx11-dev libxcb-util-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxcb-xinerama0-dev \
            libxcb-xinput-dev libxcb-composite0-dev libxkbcommon-dev \
            libpulse-dev libpipewire-0.3-dev libjack-dev \
            libwayland-dev wayland-protocols \
            libasound2-dev libv4l-dev libcurl4-openssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Clone OBS Studio
        run: |
          git clone --recursive --depth 1 \
            -b ${{ env.OBS_VERSION }} \
            https://github.com/obsproject/obs-studio.git obs-studio

      - name: Get VST3 SDK
        run: |
          git clone --recursive --depth 1 \
            https://github.com/steinbergmedia/vst3sdk.git "${{ github.workspace }}/vst3sdk"

      - name: Copy plugin into OBS tree
        run: |
          cp -r "${{ github.workspace }}/obs-vst3-plugin/obs-vst3" \
            "${{ github.workspace }}/obs-studio/plugins/obs-vst3"

      - name: Configure CMake
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_VST3=ON -DENABLE_VST=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_WEBRTC=OFF \
            -DENABLE_PIPEWIRE=ON -DENABLE_PULSEAUDIO=ON \
            -DENABLE_JACK=ON \
            -DVST3SDK_PATH="${{ github.workspace }}/vst3sdk"

      - name: Build
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake --build build --target obs-vst3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vst3-plugin-linux-x64
          path: |
            ${{ github.workspace }}/obs-studio/build/plugins/obs-vst3/*.so
          if-no-files-found: warn

  build-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          path: obs-vst3-plugin

      - name: Install Dependencies
        run: |
          brew install cmake ninja qt

      - name: Clone OBS Studio
        run: |
          git clone --recursive --depth 1 \
            -b ${{ env.OBS_VERSION }} \
            https://github.com/obsproject/obs-studio.git obs-studio

      - name: Get VST3 SDK
        run: |
          git clone --recursive --depth 1 \
            https://github.com/steinbergmedia/vst3sdk.git "${{ github.workspace }}/vst3sdk"

      - name: Copy plugin into OBS tree
        run: |
          cp -r "${{ github.workspace }}/obs-vst3-plugin/obs-vst3" \
            "${{ github.workspace }}/obs-studio/plugins/obs-vst3"

      - name: Configure CMake
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_VST3=ON -DENABLE_VST=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_WEBRTC=OFF \
            -DVST3SDK_PATH="${{ github.workspace }}/vst3sdk"

      - name: Build
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake --build build --target obs-vst3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vst3-plugin-macos-universal
          path: |
            ${{ github.workspace }}/obs-studio/build/plugins/obs-vst3/*.dylib
          if-no-files-found: warn

  create-release:
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Package
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            zip -r "../release/${dir%/}.zip" "$dir"
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
