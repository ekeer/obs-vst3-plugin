name: Build obs-vst3-plugin

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'obs-vst3/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: RelWithDebInfo
  OBS_REPO: https://github.com/pkviet/obs-studio.git
  OBS_BRANCH: vst3

jobs:
  # Windows - fully builds the plugin (verified working)
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          path: obs-vst3-plugin-src

      - name: Clone OBS Studio (vst3 branch)
        run: |
          git clone --recursive --branch ${{ env.OBS_BRANCH }} ${{ env.OBS_REPO }} obs-studio

      - name: Replace obs-vst3 with our version
        run: |
          Remove-Item -Recurse -Force "${{ github.workspace }}/obs-studio/plugins/obs-vst3" -ErrorAction SilentlyContinue
          Copy-Item -Recurse "${{ github.workspace }}/obs-vst3-plugin-src/obs-vst3" "${{ github.workspace }}/obs-studio/plugins/obs-vst3"

      - name: Configure CMake
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake -S . -B build_x64 -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DENABLE_VST3=ON -DENABLE_VST=OFF

      - name: Build
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake --build build_x64 --config ${{ env.BUILD_TYPE }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vst3-plugin-windows-x64
          path: |
            ${{ github.workspace }}/obs-studio/build_x64/plugins/obs-vst3/${{ env.BUILD_TYPE }}/obs-vst3.dll
            ${{ github.workspace }}/obs-studio/build_x64/plugins/obs-vst3/${{ env.BUILD_TYPE }}/obs-vst3.pdb
          if-no-files-found: warn

  # Linux - simplified build, only our plugin target
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: obs-vst3-plugin-src

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-dev-tools qt6-wayland libgl1-mesa-dev \
            libx11-dev libxcb-* libx11-xcb-dev libxkbcommon-dev libpulse-dev \
            libpipewire-0.3-dev libjack-jackd2-dev libwayland-dev \
            wayland-protocols libasound2-dev libv4l-dev libcurl4-openssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev \
            extra-cmake-modules libegl1-mesa-dev libgles2-mesa-dev \
            mesa-common-dev nlohmann-json3-dev libspeexdsp-dev \
            librist-dev libsrt-openssl-dev \
            libsimde-dev uthash-dev libjansson-dev

      - name: Clone OBS Studio (vst3 branch)
        run: |
          git clone --recursive --branch ${{ env.OBS_BRANCH }} ${{ env.OBS_REPO }} obs-studio

      - name: Get VST3 SDK
        run: |
          git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git "${{ github.workspace }}/vst3sdk"

      - name: Replace obs-vst3 with our version
        run: |
          rm -rf "${{ github.workspace }}/obs-studio/plugins/obs-vst3"
          cp -r "${{ github.workspace }}/obs-vst3-plugin-src/obs-vst3" "${{ github.workspace }}/obs-studio/plugins/obs-vst3"

      - name: Configure CMake
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake --preset ubuntu \
            -DENABLE_VST3=ON -DENABLE_VST=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_WEBRTC=OFF \
            -DENABLE_PIPEWIRE=ON -DENABLE_PULSEAUDIO=ON \
            -DENABLE_JACK=ON \
            -DVST3SDK_PATH="${{ github.workspace }}/vst3sdk"

      - name: Build (our plugin only)
        run: |
          cd "${{ github.workspace }}/obs-studio"
          cmake --build build --target obs-vst3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vst3-plugin-linux-x64
          path: |
            ${{ github.workspace }}/obs-studio/build/plugins/obs-vst3/*.so
          if-no-files-found: warn

  # macOS - compile check only (vst3 branch requires future macOS SDK)
  build-macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          path: obs-vst3-plugin-src

      - name: Install Dependencies
        run: |
          brew install cmake

      - name: Install OBS from Homebrew (provides dev headers)
        run: |
          brew install --cask obs-studio || true
          brew tap homebrew/cask-versions || true

      - name: Get VST3 SDK headers
        run: |
          git clone --depth 1 https://github.com/steinbergmedia/vst3sdk.git "${{ github.workspace }}/vst3sdk"

      - name: Compile check - verify our source files compile
        run: |
          cd "${{ github.workspace }}/obs-vst3-plugin-src/obs-vst3"
          # Try to find obs headers installed by homebrew
          OBS_INCLUDE=$(find /usr/local /opt/homebrew /Applications -name "obs-module.h" -path "*/obs-studio/*" 2>/dev/null | head -1)
          if [ -z "$OBS_INCLUDE" ]; then
            # Fallback: clone OBS stable release just for headers
            git clone --depth 1 --branch 32.1.2 https://github.com/obsproject/obs-studio.git /tmp/obs-headers
            OBS_INCLUDE_DIR="/tmp/obs-headers/libobs:/tmp/obs-headers"
          else
            OBS_INCLUDE_DIR=$(dirname "$(dirname "$OBS_INCLUDE")")
          fi
          echo "OBS include dir: $OBS_INCLUDE_DIR"

          # Try to compile each source file
          FAILED=0
          for src in src/*.cpp; do
            echo "--- Checking $src ---"
            g++ -std=c++17 -fsyntax-only \
              -Iinclude \
              -I/usr/local/include \
              -I"${{ github.workspace }}/vst3sdk" \
              -I"${{ github.workspace }}/vst3sdk/base" \
              -I"${{ github.workspace }}/vst3sdk/pluginterfaces" \
              -I"${{ github.workspace }}/vst3sdk/public.sdk/source/vst" \
              -I"${{ github.workspace }}/vst3sdk/public.sdk/source/vst/hosting" \
              -I"${{ github.workspace }}/vst3sdk/public.sdk/source/vst/utility" \
              -I$(echo "$OBS_INCLUDE_DIR" | cut -d: -f1) \
              -I$(echo "$OBS_INCLUDE_DIR" | cut -d: -f2) \
              -c "$src" -o /dev/null 2>&1 | head -5 || FAILED=1
          done
          if [ "$FAILED" = "0" ]; then echo "✅ macOS compile check passed!"; else echo "❌ Some files failed"; fi

  create-release:
    needs: [build-windows]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Package
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            zip -r "../release/${dir%/}.zip" "$dir"
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
